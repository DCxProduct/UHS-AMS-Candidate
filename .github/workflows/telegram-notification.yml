#WORK
name: Telegram Notification

on:
  push:
    branches:
      - main

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          MESSAGE="🚀 <b>${{ github.event.repository.name }}</b>"$'\n'
          MESSAGE+="━━━━━━━━━━━━━━━━━━"$'\n\n'
          MESSAGE+="📦 <b>Repository:</b> ${{ github.repository }}"$'\n'
          MESSAGE+="🌿 <b>Branch:</b> main"$'\n'
          MESSAGE+="👨‍💻 <b>Developer:</b> ${{ github.actor }}"$'\n\n'
          MESSAGE+="📝 <b>Commit Message:</b>"$'\n'
          MESSAGE+="${{ github.event.head_commit.message }}"$'\n\n'
          MESSAGE+="🔗 <a href=\"${COMMIT_URL}\"><b>Open Commit</b></a>"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":false'; then
            exit 1
          fi
